system:
  environment: development
  random_seed: 42
  approval_token_expiry_seconds: 3600

ingestion:
  allowed_domains: ["moseta.in", "pulsepeak.example", "terraroast.example"]
  chunk_size_chars: 500
  chunk_overlap_chars: 50
  separators: ["\n\n", "\n", ". ", " ", ""]
  injection_quarantine_threshold: 0.85

retrieval:
  rrf_k: 60
  candidate_pool_size: 50
  rerank_candidate_count: 20
  rerank_top_k: 5
  multi_query_expansion_count: 3
  embedding_model: baai/bge-m3
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2

channels:
  sms:
    max_characters: 160
  instagram:
    max_characters: 2200
    max_hashtags: 30
  x:
    max_characters: 280
  facebook:
    max_characters: 5000
  email:
    max_subject_characters: 78
    max_body_characters: 10000
